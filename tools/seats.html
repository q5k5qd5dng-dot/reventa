const P = new URLSearchParams(location.search);

scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x4b5a8c, +(P.get("hemi")||0.55)));

// materiales
const white = new THREE.MeshPhysicalMaterial({ color: 0xe9edf9, roughness: 0.3, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.12, sheen: 0.3 });

const concrete = new THREE.MeshStandardMaterial({ color: 0x56649a, roughness: 0.95 });
const accM = new THREE.MeshPhysicalMaterial({ color: new THREE.Color(ACC), roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.08 });
const accIn = new THREE.MeshPhysicalMaterial({ color: new THREE.Color(ACC).multiplyScalar(1.12), roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.1 });

// geometrías
function backShape(w, h, rt, rb) {
  const s = new THREE.Shape(), x = -w / 2, y = 0;
  s.moveTo(x + rb, y); s.lineTo(x + w - rb, y); s.quadraticCurveTo(x + w, y, x + w, y + rb);
  s.lineTo(x + w, y + h - rt); s.quadraticCurveTo(x + w, y + h, x + w - rt, y + h);
  s.lineTo(x + rt, y + h); s.quadraticCurveTo(x, y + h, x, y + h - rt);

}

  const bi = new THREE.Mesh(gInner, iM); bi.position.set(0, 0.30, 0.092); g.add(bi);
  const mech = new THREE.Mesh(gMech, dark); mech.position.set(0, 0.2, 0.04); g.add(mech);
  if (accent) {
    // asiento bajado (plano)
    const pan = new THREE.Mesh(gSeatPan, bM); pan.rotation.x = -Math.PI / 2 + 0.04; pan.position.set(0, 0.22, 0.52); g.add(pan);
    const sup = new THREE.Mesh(gMech, dark); sup.position.set(0, 0.16, 0.12); g.add(sup);
  } else {
    const cu = new THREE.Mesh(gCush, bM); cu.position.set(0, 0.0, 0.1); cu.rotation.x = -0.12; g.add(cu);
  }

const ROWS = +(P.get("rows") || 7), COLS = +(P.get("cols") || 25);
const ACC_ROW = +(P.get("ar") || 2), ACC_COL = +(P.get("ac") || 14);
for (let r = 0; r < ROWS; r++) {

  // grada
  const SH = ROWRISE + 0.5;
  const step = new THREE.Mesh(new THREE.BoxGeometry(120, SH, ROWDEPTH + 0.02), concrete);
  step.position.set(0, y - SH / 2, z - 0.1); step.receiveShadow = true; step.castShadow = true; scene.add(step);
  for (let c = 0; c < COLS; c++) {
    const x = (c - (COLS - 1) / 2) * PITCH;
    const s = seat(r === ACC_ROW && c === ACC_COL);
    s.position.set(x, y, z - 0.25);
    s.rotation.x = -0.05;
    s.rotation.y = (Math.random() - 0.5) * 0.02;
    scene.add(s);
  }
}
// render doble (fondo negro / blanco) para recuperar el canal alfa

  const c2 = document.createElement("canvas"); c2.width = W; c2.height = H;

  if (A > 0.003) { out.data[i] = Math.min(255, a.data[i] / A); out.data[i + 1] = Math.min(255, a.data[i + 1] / A); out.data[i + 2] = Math.min(255, a.data[i + 2] / A); }
}
const oc = document.createElement("canvas"); oc.width = W; oc.height = H; oc.getContext("2d").putImageData(out, 0, 0);
let sx = 0, sy = 0, sn = 0, minY = H;
for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) { const k = (j * W + i) * 4, r = out.data[k], g = out.data[k + 1], b = out.data[k + 2], a = out.data[k + 3]; if (a > 200 && r > 200 && g > 70 && g < 150 && b < 70) { sx += i; sy += j; sn++; if (j < minY) minY = j; } }
window.__seat = sn ? { x: +(sx / sn / W).toFixed(4), y: +(sy / sn / H).toFixed(4), top: +(minY / H).toFixed(4) } : null;
