<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight-latin.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }

        #lg-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Inter Tight", system-ui, sans-serif;
          color: #fff;
        }

        /* Lockup Wave: squircle 150 + "Wave" 128 px, gap 28, centrado en (960, 540).
           El CSS de #lg-lockup/#lg-mark/#lg-word es identico al de la escena de cierre (#ou-*). */
        #lg-lockup {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 28px;
          transform-origin: 50% 50%;
          will-change: transform, filter, opacity;
        }
        /* scrim: oscurece suavemente el glow tras el lockup para que el blanco lea con contraste */
        #lg-scrim {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 1560px;
          height: 1080px;
          margin: -540px 0 0 -780px;
          border-radius: 50%;
          background: radial-gradient(closest-side, rgba(2, 34, 46, 0.38) 0%, rgba(2, 34, 46, 0.37) 22%, rgba(2, 34, 46, 0.33) 40%, rgba(2, 34, 46, 0.25) 56%, rgba(2, 34, 46, 0.15) 72%, rgba(2, 34, 46, 0.05) 88%, rgba(2, 34, 46, 0) 100%);
          pointer-events: none;
        }
        #lg-mark {
          position: relative;
          flex: none;
          width: 150px;
          height: 150px;
          z-index: 2;
        }
        #lg-shadow {
          position: absolute;
          inset: 0;
          border-radius: 28.125%;
          box-shadow: 0 18px 44px rgba(2, 38, 50, 0.42), 0 2px 8px rgba(2, 38, 50, 0.25);
        }
        #lg-sq {
          position: absolute;
          left: 0;
          top: 0;
          width: 150px;
          height: 150px;
          display: block;
          overflow: visible;
        }
        #lg-wordbox {
          position: relative;
          flex: none;
          width: 310px;
          height: 128px;
          z-index: 1;
        }
        #lg-word {
          display: block;
          width: 310px;
          height: 128px;
          font-size: 128px;
          font-weight: 700;
          line-height: 128px;
          white-space: nowrap;
          color: #fff;
          transform-origin: 0% 50%;
          filter: drop-shadow(0 6px 17px rgba(2, 44, 58, 0.4));
        }
        /* letras absolutas en las posiciones kerneadas de "Wave" (Inter Tight 700 128px, -0.04em):
           mismas coordenadas en la escena de cierre -> lockup identico al pixel */
        #lg-word .lg-l {
          position: absolute;
          top: 0;
          display: block;
          letter-spacing: -0.04em;
          will-change: transform, filter, opacity;
        }
        #lg-l0 { left: 0px; }
        #lg-l1 { left: 115.83px; }
        #lg-l2 { left: 178.72px; }
        #lg-l3 { left: 242.13px; }
      </style>

      <div id="lg-root" data-composition-id="scene-logo" data-width="1920" data-height="1080">
        <div id="lg-lockup">
          <div id="lg-scrim"></div>
          <div id="lg-mark">
            <div id="lg-shadow"></div>
            <svg id="lg-sq" viewBox="0 0 32 32" aria-hidden="true">
              <rect width="32" height="32" rx="9" fill="#21AEC0" />
              <path d="M5 13c3-3 5-3 8 0s5 3 8 0 4-3 6-1.5M5 20c3-3 5-3 8 0s5 3 8 0 4-3 6-1.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" />
            </svg>
          </div>
          <div id="lg-wordbox">
            <div id="lg-word"><span class="lg-l" id="lg-l0">W</span><span class="lg-l" id="lg-l1">a</span><span class="lg-l" id="lg-l2">v</span><span class="lg-l" id="lg-l3">e</span></div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // ---- entrada (0.15 -> 1.05): el squircle primero, el texto ~0.1 s despues con tracking que se cierra
        tl.fromTo("#lg-mark",
          { opacity: 0, y: 30, scale: 0.92, filter: "blur(24px)" },
          { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.75, ease: "power3.out" }, 0.15);

        tl.fromTo("#lg-word",
          { y: 30, scale: 0.92 },
          { y: 0, scale: 1, duration: 0.85, ease: "power3.out" }, 0.25);
        // tracking: cada letra parte desplazada (i * 26 px) y converge a su sitio kerneado
        [0, 1, 2, 3].forEach((i) => {
          const t0 = 0.25 + i * 0.06;
          tl.fromTo("#lg-l" + i,
            { x: i * 26, opacity: 0, filter: "blur(22px)" },
            { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.8, ease: "power3.out" }, t0);
        });

        // ---- respiracion durante el hold (nunca estatico)
        tl.fromTo("#lg-lockup", { scale: 1 }, { scale: 1.025, duration: 0.54, ease: "sine.inOut" }, 0.9);

        // ---- salida (1.45 -> 2.1): se encoge, se desenfoca y sube mientras llega el movil
        tl.fromTo("#lg-lockup",
          { scale: 1.025, y: 0, opacity: 1, filter: "blur(0px)" },
          { scale: 0.55, y: -40, opacity: 0, filter: "blur(18px)", duration: 0.65, ease: "power2.in", immediateRender: false }, 1.45);

        window.__timelines["scene-logo"] = tl;
      </script>
    </template>
  </body>
</html>
