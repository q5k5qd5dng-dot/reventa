        /* ---- glass surface (tokens: fill rgba(214,222,228,.20), border .14, r22, shadow) + dark tint for legibility ---- */

        #fd-fill-txt { position: absolute; left: 0; top: 0; width: 300px; height: 52px; }

        }

        /* ---- quick-access tiles ---- */
        #fd-tiles {
          position: absolute; left: 280px; top: 258px; width: 1300px; height: 400px;
          -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 170px), transparent 100%);
                  mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 170px), transparent 100%);
        }
        .fd-tile {
          position: absolute; width: 400px; height: 112px; overflow: hidden;

        .fd-tile { background:

          box-shadow: 0 24px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.16);
          border-radius: 22px; }
        .fd-tile-img { width: 112px; height: 112px; background-size: cover; background-position: 50% 8%; flex: none; margin-left: -1px; }
        .fd-tile-txt { padding: 0 16px 0 22px; min-width: 0; }
        .fd-tile-title { font-size: 30px; font-weight: 650; letter-spacing: -0.015em; line-height: 1.1; white-space: nowrap; }
        .fd-tile-sub { margin-top: 7px; font-size: 17px; font-weight: 500; line-height: 1; color: rgba(255,255,255,.88); white-space: nowrap; }

        /* ---- section title ---- */

      <script>
        const tl = gsap.timeline({ paused: true });
        const B0 = "blur(0px)";

        /* ---- board: constant gentle tilt drift so nothing is ever static ---- */
        tl.fromTo("#fd-board", { rotationY: -11, rotationX: 5.5, y: 14 },
                               { rotationY: -5.5, rotationX: 3, y: -12, duration: 4.7, ease: "sine.inOut" }, 0);

        /* ---- 0.25-0.95 pills (bg + text layers share the same tween) ---- */
        tl.fromTo("#fd-pb-0", { opacity: 0, y: 26, filter: "blur(14px)" },
                              { opacity: 1, y: 0, filter: B0, duration: 0.55, ease: "power3.out" }, 0.25);
        [1, 3].forEach((i, k) => {
          tl.fromTo(["#fd-pb-" + i, "#fd-pt-" + i],
            { opacity: 0, y: 26, filter: "blur(14px)" },
            { opacity: 1, y: 0, filter: B0, duration: 0.55, ease: "power3.out" }, 0.25 + (k === 0 ? 0.07 : 0.14));
        });
        /* "Todo" / "Fiestas" labels live twice: white (this layer) and dark (inside the fill, clipped by it).
           Only the copy that is actually visible stays on: no hidden/covered text at any time. */
        const flip = (sel, from, to, t) =>
          tl.fromTo(sel, { opacity: from }, { opacity: to, duration: 0.01, ease: "none", immediateRender: false }, t);
        tl.fromTo("#fd-pt-0", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);   /* white "Todo": hidden under the fill (its dark copy shows) until 1.35 */
        flip("#fd-pt-0", 0, 1, 1.36);
        flip("#fd-pt-1", 1, 0, 1.82);                                              /* fill fully covers it from 1.81 */
        tl.fromTo("#fd-ft-1", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);   /* clipped away until the fill arrives */
        flip("#fd-ft-1", 0, 1, 1.36);
        flip("#fd-ft-0", 1, 0, 1.7);                                               /* fill has left it from 1.61 */
        tl.fromTo("#fd-fill", { opacity: 0, y: 26, filter: "blur(14px)" },
                              { opacity: 1, y: 0, filter: B0, duration: 0.55, ease: "power3.out" }, 0.25);
        /* the 4th pill ("Siguiendo") stays hidden until it slots in */
        tl.fromTo(["#fd-pb-2", "#fd-pt-2"], { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

        /* ---- 0.5-1.4 quick tiles slide in from the right with blur ---- */
        const tiles = Array.from(document.querySelectorAll(".fd-tile"));
        tiles.forEach((el) => {
          const col = +el.dataset.col, row = +el.dataset.row;
          tl.fromTo(el, { x: 300, opacity: 0, filter: "blur(16px)", transformPerspective: 900 },
                        { x: 0, opacity: 1, filter: B0, duration: 0.66, ease: "power3.out" }, 0.5 + col * 0.09 + row * 0.04);
        });

        /* ---- 1.35-1.85 select "Fiestas": fill slides, "Siguiendo" slots in, "Entradas" shifts ---- */
        tl.fromTo("#fd-fill", { x: 0, width: 100 }, { x: 112, width: 124, duration: 0.46, ease: "power3.inOut", immediateRender: false }, 1.35);
        tl.fromTo("#fd-fill-txt", { x: 0 }, { x: -112, duration: 0.46, ease: "power3.inOut", immediateRender: false }, 1.35);
        tl.fromTo(["#fd-pb-3", "#fd-pt-3"], { x: 0 }, { x: 158, duration: 0.48, ease: "power3.out", immediateRender: false }, 1.38);
        tl.fromTo(["#fd-pb-2", "#fd-pt-2"], { opacity: 0, scale: 0.88, filter: "blur(10px)" },
                                           { opacity: 1, scale: 1, filter: B0, duration: 0.42, ease: "power3.out", immediateRender: false }, 1.56);

        /* ---- 1.9-2.4 tiles leave to the left (blur + fade + rotateY) ---- */
        tiles.forEach((el) => {
          const col = +el.dataset.col, row = +el.dataset.row;
          tl.fromTo(el, { x: 0, rotationY: 0, opacity: 1, filter: B0 },
                        { x: -200, rotationY: 28, opacity: 0, filter: "blur(14px)", duration: 0.46, ease: "power2.in", immediateRender: false }, 1.9 + col * 0.035 + row * 0.02);
        });

        /* ---- 1.95-2.8 camera: pills glide up from the vertical centre to the top of the board ---- */
        tl.fromTo("#fd-cam", { y: 146 }, { y: 0, duration: 0.85, ease: "power3.inOut" }, 1.95);

        /* ---- 2.3-3.2 title + cards from deep z / right, rotateY -25 -> 0 ---- */
        tl.fromTo(["#fd-title-h", "#fd-title-more"], { opacity: 0, y: 24, filter: "blur(12px)" },
                                   { opacity: 1, y: 0, filter: B0, duration: 0.6, ease: "power3.out" }, 2.3);
        const cardEnter = (sel, t0) => {
          tl.fromTo(sel, { x: 170, z: -420, rotationY: -25, opacity: 0, filter: "blur(14px)", transformPerspective: 1300 },
                         { x: 0, z: 0, rotationY: 0, opacity: 1, filter: B0, duration: 0.68, ease: "power3.out" }, t0);
        };
        ["neon", "aurora", "noir"].forEach((id, i) => cardEnter("#fd-card-" + id, 2.3 + i * 0.12));
        ["afterglow", "sol", "onda"].forEach((id, i) => cardEnter("#fd-card-" + id, 2.42 + i * 0.12));

        /* ---- posters drift: slow push-out (1.10 -> 1.0) while they are on screen ---- */
        tl.fromTo(".fd-poster img", { scale: 1.12 }, { scale: 1, duration: 2.6, ease: "power2.out" }, 2.3);

        /* ---- 3.6-4.4 scroll to the second row ---- */
        tl.fromTo("#fd-cam", { y: 0 }, { y: -470, duration: 0.8, ease: "power3.inOut", immediateRender: false }, 3.6);

        /* ---- 4.6-5.2 exit: blur out, fade, drift back in z ---- */
        tl.fromTo("#fd-board", { z: 0 }, { z: -460, duration: 0.6, ease: "power2.in", immediateRender: false }, 4.6);
        tl.fromTo("#fd-stage", { filter: B0 }, { filter: "blur(22px)", duration: 0.6, ease: "power2.in", immediateRender: false }, 4.6);
        tl.fromTo("#fd-stage", { opacity: 1 }, { opacity: 0, duration: 0.52, ease: "power1.inOut", immediateRender: false }, 4.6);

        window.__timelines["scene-feed"] = tl;
      </script>
