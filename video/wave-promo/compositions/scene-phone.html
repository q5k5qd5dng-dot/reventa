      <script>
        const tl = gsap.timeline({ paused: true });
        const P = "#ph-phone";

        // ---------- 0.00 - 1.00  flight in (one object: z + rotations, no scale-only depth)
        tl.fromTo(P, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "none" }, 0);
        tl.fromTo(P,
          { x: 760, y: -470, z: -6800, scale: 0.62, rotationY: -62, rotationZ: 34 },
          { x: 0, y: 0, z: 0, scale: 0.95, rotationY: 0, rotationZ: 0, duration: 1.05, ease: "power2.out" }, 0);
        tl.fromTo(P, { rotationX: 74 }, { rotationX: 9, duration: 0.8, ease: "power2.out" }, 0);
        tl.to(P, { rotationX: 16, duration: 0.2, ease: "sine.inOut" }, 0.8);
        tl.fromTo("#ph-stage", { filter: "blur(9px)" }, { filter: "blur(0px)", duration: 0.7, ease: "power2.out" }, 0);

        // specular sweep across the glass while it flies in / over the opened app
        tl.fromTo("#ph-glare", { x: -140 }, { x: 560, duration: 1.0, ease: "power1.inOut" }, 0.05);
        tl.fromTo("#ph-glare", { x: -140 }, { x: 560, duration: 0.8, ease: "power1.inOut", immediateRender: false }, 2.95);

        // ---------- 1.00 - 1.95  breathe on the lock screen -> swipe-up -> home (unchanged look)
        tl.to(P, { rotationX: 6, duration: 0.92, ease: "power2.inOut" }, 1.0);
        tl.to(P, { scale: 1.12, duration: 0.55, ease: "power2.inOut" }, 1.0);
        tl.to(P, { rotationY: -4, duration: 0.45, ease: "sine.inOut" }, 1.0);
        tl.to(P, { rotationY: 0, duration: 0.5, ease: "sine.inOut" }, 1.45);
        // settle: whole phone, centred, uncropped, slowly easing back for the home-screen rest
        tl.to(P, { scale: 1.06, duration: 0.75, ease: "sine.out" }, 1.55);

        // notification: drops from the top with a soft rebound
        tl.fromTo("#ph-notif", { y: -600 }, { y: 0, duration: 0.62, ease: "back.out(1.35)" }, 1.0);
        tl.fromTo("#ph-notif", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none", immediateRender: false }, 1.0);
        tl.fromTo("#ph-notif2", { y: -26 }, { y: 0, duration: 0.3, ease: "power2.out" }, 1.22);
        tl.fromTo("#ph-notif2", { opacity: 0 }, { opacity: 0.5, duration: 0.25, ease: "power1.out", immediateRender: false }, 1.22);

        // lock layer swipes up and out
        tl.to("#ph-lock", { y: -430, duration: 0.5, ease: "power2.in" }, 1.4);
        tl.to("#ph-lock", { opacity: 0, duration: 0.1, ease: "power1.out" }, 1.4);
        tl.fromTo("#ph-dim", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.inOut" }, 1.4);
        tl.fromTo("#ph-stime", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 1.52);

        // home: widget + icons enter with stagger
        tl.fromTo("#ph-widget", { opacity: 0, scale: 0.9, y: 16 }, { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "power3.out" }, 1.46);
        tl.fromTo(".ph-app:not(#ph-waveapp)", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out", stagger: 0.015 }, 1.5);
        tl.fromTo("#ph-waveapp", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 1.52);
        tl.fromTo("#ph-dock, #ph-dots", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 1.68);

        // ---------- 1.95 - 2.30  home at rest: touch indicator on the real Wave icon + press
        const PR = 0.92;                                   // pressed scale of the icon
        const OW = 72 * PR, OH = 72.94 * PR;
        const OL = 154.67 - OW / 2, OT = 518.47 - OH / 2;  // pressed icon rect (screen px)
        tl.fromTo("#ph-tap", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power2.out" }, 1.97);
        tl.fromTo("#ph-tap", { scale: 1 }, { scale: 0.86, duration: 0.1, ease: "power2.out", immediateRender: false }, 2.14);
        tl.fromTo("#ph-waveicon", { scale: 1 }, { scale: PR, duration: 0.1, ease: "power2.out" }, 2.14);
        tl.fromTo("#ph-waveshade", { opacity: 0 }, { opacity: 0.2, duration: 0.1, ease: "power2.out" }, 2.14);

        // ---------- 2.30 - 2.95  iOS-style opening: the icon rect becomes the screen (spring), home recedes
        const T0 = 2.3, OD = 0.62, SPRING = "back.out(0.8)";
        tl.set("#ph-open", { opacity: 1 }, T0);
        // reveal window: clip-path from the pressed icon rect to the whole screen, corner radius 16 -> 52
        tl.fromTo("#ph-open",
          { "--ct": OT + "px", "--cr": (406 - OL - OW) + "px", "--cl": OL + "px", "--cb": (856 - OT - OH) + "px", "--rad": "18px" },
          { "--ct": "0px", "--cr": "0px", "--cl": "0px", "--cb": "0px", "--rad": "52px", immediateRender: false, duration: OD, ease: SPRING }, T0);
        // the real screen grows with the window (anchored top-left; width = window width)
        tl.fromTo("#ph-open-in", { x: OL, y: OT, scale: OW / 406 }, { x: 0, y: 0, scale: 1, immediateRender: false, duration: OD, ease: SPRING }, T0);
        tl.set("#ph-open-in", { opacity: 1 }, T0);
        // the icon layer rides the window centre and dissolves almost at once (no big ghost icon)
        tl.fromTo("#ph-open-icw", { x: OL, y: OT, scale: PR }, { x: 203 - 54, y: 428 - 54.7, scale: 1.5, immediateRender: false, duration: OD, ease: "power3.out" }, T0);
        tl.fromTo("#ph-open-icw", { opacity: 1 }, { opacity: 0, duration: 0.07, ease: "none", immediateRender: false }, T0);
        // touch indicator releases, home screen recedes (iOS: it zooms toward the viewer, softens, fades)
        tl.fromTo("#ph-tap", { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power1.out", immediateRender: false }, T0);
        tl.fromTo("#ph-tap", { scale: 0.86 }, { scale: 1.4, duration: 0.2, ease: "power2.out", immediateRender: false }, T0);
        tl.fromTo("#ph-home", { scale: 1, opacity: 1, filter: "blur(0px)" }, { scale: 1.14, opacity: 0, filter: "blur(5px)", duration: 0.5, ease: "power2.out", immediateRender: false }, T0 + 0.03);
        tl.fromTo("#ph-waveshade", { opacity: 0.2 }, { opacity: 0, duration: 0.1, ease: "none", immediateRender: false }, T0);
        tl.fromTo("#ph-open-shade", { opacity: 0.2 }, { opacity: 0, duration: 0.08, ease: "none", immediateRender: false }, T0);

        // ---------- camera
        // opening: gentle push toward the screen while it grows
        tl.to(P, { scale: 1.12, rotationX: 4, rotationY: -3, duration: 0.67, ease: "power2.out" }, 2.28);
        // app in view: slow dolly-in, still the whole phone (island and status bar stay clear)
        tl.to(P, { scale: 1.17, y: 2, rotationX: 3, rotationY: -5, duration: 0.5, ease: "sine.inOut" }, 2.95);

        // ---------- 2.92 - 3.55  the app lives: a small fling-scroll (tab bar stays fixed, content fades under it)
        tl.fromTo("#ph-scroll", { y: 0 }, { y: -72, duration: 0.7, ease: "power2.out" }, 2.92);
        tl.fromTo("#ph-topscrim", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.92);
        tl.fromTo("#ph-scrollfade", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 2.92);

        // ---------- 3.42 - 4.00  violet / white light entry: the camera passes through the screen
        tl.to(P, { scale: 3.3, y: 40, rotationX: 0, rotationY: -1, duration: 0.4, ease: "power3.in" }, 3.42);
        tl.to("#ph-stage", { filter: "blur(14px)", duration: 0.36, ease: "power2.in" }, 3.46);
        tl.to(P, { opacity: 0, duration: 0.06, ease: "none" }, 3.74);

        // short stepped jitter + RGB split on the screen (a few frames only)
        tl.set("#ph-cam", { filter: "none" }, 0);
        [[3.46, 12, -3], [3.49, -10, 2], [3.52, 7, -2], [3.55, 0, 0], [3.58, -14, 4], [3.61, 0, 0]]
          .forEach(([t, x, sk]) => tl.set("#ph-cam", { x: x, skewX: sk }, t));
        const split = (px) => "drop-shadow(" + px + "px 0 0 rgba(255,45,115,.6)) drop-shadow(" + (-px) + "px 0 0 rgba(0,225,255,.6))";
        tl.set("#ph-cam", { filter: split(6) }, 3.46);
        tl.set("#ph-cam", { filter: split(3) }, 3.52);
        tl.set("#ph-cam", { filter: split(9) }, 3.58);
        tl.set("#ph-cam", { filter: "none" }, 3.63);

        // light born at the screen centre
        const grow = (sel, t0, d, s0, s1, ease, o1) => {
          tl.fromTo(sel, { scale: s0 }, { scale: s1, duration: d, ease: ease }, t0);
          tl.fromTo(sel, { opacity: 0 }, { opacity: o1, duration: Math.min(0.12, d), ease: "power1.out", immediateRender: false }, t0);
        };
        grow("#ph-b-lav", 3.48, 0.30, 0.06, 2.4, "power2.in", 0.9);
        grow("#ph-b-base", 3.50, 0.30, 0.05, 4.8, "power2.in", 0.96);
        grow("#ph-b-mg", 3.52, 0.28, 0.05, 3.0, "power2.in", 0.75);
        grow("#ph-b-wh", 3.54, 0.22, 0.05, 1.8, "power3.in", 0.6);
        // shock ring
        tl.fromTo("#ph-ring", { scale: 0.08 }, { scale: 2.4, duration: 0.34, ease: "power2.out" }, 3.50);
        tl.fromTo("#ph-ring", { opacity: 0 }, { opacity: 0.8, duration: 0.06, ease: "none", immediateRender: false }, 3.50);
        tl.to("#ph-ring", { opacity: 0, duration: 0.2, ease: "power1.in" }, 3.64);
        // anamorphic light streak through the centre
        tl.fromTo("#ph-streak", { scaleX: 0.05, scaleY: 1, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.14, ease: "power3.out", immediateRender: false }, 3.58);
        tl.to("#ph-streak", { scaleY: 0.2, opacity: 0, duration: 0.2, ease: "power2.in" }, 3.72);

        // three short glitch bars (a few frames each)
        const bars = {
          "#ph-bar1": [[3.47, -160, 14, 0.9], [3.51, 140, -16, 1], [3.56, -60, 8, 0.8], [3.61, 0, 0, 0]],
          "#ph-bar2": [[3.49, 220, -10, 1], [3.54, -200, 12, 1], [3.59, 90, -6, 0.8], [3.64, 0, 0, 0]],
          "#ph-bar3": [[3.52, -120, 10, 0.85], [3.57, 180, -14, 1], [3.62, -40, 4, 0.7], [3.67, 0, 0, 0]],
        };
        Object.keys(bars).forEach((sel) => bars[sel].forEach(([t, x, sk, o]) => tl.set(sel, { x: x, skewX: sk, opacity: o * 0.85 }, t)));
        tl.set("#ph-flash", { opacity: 0.4 }, 3.47); tl.set("#ph-flash", { opacity: 0 }, 3.5);
        tl.set("#ph-flash", { opacity: 0.3 }, 3.6); tl.set("#ph-flash", { opacity: 0 }, 3.63);

        // peak ~3.72 (frame is bright lavender), then everything dissolves to transparent by 4.0
        tl.to("#ph-fx", { opacity: 0, duration: 0.28, ease: "power2.inOut" }, 3.72);
        tl.fromTo("#ph-fx", { filter: "blur(0px)" }, { filter: "blur(16px)", duration: 0.28, ease: "power1.in", immediateRender: false }, 3.72);

        window.__timelines["scene-phone"] = tl;

      </script>
    </template>
