          "#ph-bar6": [[2.18, 140, -14, 0.9], [2.27, -220, 18, 1], [2.37, 100, -8, 1], [2.43, 0, 0, 0]],
        };
        Object.keys(bars).forEach((sel) => bars[sel].forEach(([t, x, sk, o]) => tl.set(sel, { x: x, skewX: sk, opacity: o * 0.8 }, t)));

        // white flash flickers (stepped)
        [[2.12, 0.5], [2.15, 0], [2.34, 0.45], [2.37, 0.1], [2.4, 0], [2.5, 0.35], [2.53, 0]].forEach(([t, o]) => tl.set("#ph-flash", { opacity: o }, t));

        // after the peak the flood settles into deeper violet (white core and veins pull back)
        tl.to("#ph-b-wh", { opacity: 0.7, duration: 0.2, ease: "power1.out" }, 2.5);
        tl.to("#ph-veins", { opacity: 0.2, duration: 0.2, ease: "power1.out" }, 2.5);
        tl.to(["#ph-arm1", "#ph-arm3"], { opacity: 0.55, duration: 0.2, ease: "power1.out" }, 2.5);

        // dissolve to transparent (glow underneath stays clean)
        tl.to("#ph-fx", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 2.7);
        tl.to("#ph-fx", { filter: "blur(16px)", duration: 0.4, ease: "power1.in" }, 2.7);
        tl.set("#ph-fx", { filter: "blur(0px)" }, 0);

        window.__timelines["scene-phone"] = tl;

      </script>
    </template>
  </body>
