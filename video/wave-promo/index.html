    <script>
      const tl = gsap.timeline({ paused: true });
      const TOTAL = 15.9;

      // Cadena de waypoints globales para una luz: cada tramo es un fromTo con TODOS los valores explicitos
      // (sin solapes sobre la misma propiedad => resultado identico al reproducir y al saltar con seek).
      function chain(sel, pts) {
        tl.set(sel, { xPercent: -50, yPercent: -50, transformOrigin: "50% 50%" }, 0);
        for (let i = 1; i < pts.length; i++) {
          const a = pts[i - 1], b = pts[i];
          const from = { x: a.x, y: a.y, scale: a.s, opacity: a.o, rotation: a.r || 0 };
          const to = { x: b.x, y: b.y, scale: b.s, opacity: b.o, rotation: b.r || 0, duration: b.t - a.t, ease: b.e || "sine.inOut" };
          tl.fromTo(sel, from, to, a.t);
        }
      }

      // Deriva organica: oscilacion senoidal lenta de la capa interior (.bgi) de cada luz, un periodo distinto por eje.
      // Tramos entre extremos con sine.inOut = senoide exacta; todo finito y determinista.
      function drift(sel, prop, amp, period, phase, base) {
        const el = sel + " .bgi";
        const f = (t) => (base || 0) + amp * Math.sin((2 * Math.PI * t) / period + phase);
        let t0 = 0;
        // primer extremo posterior a 0: sin(2πt/T + φ) = ±1
        let te = ((Math.PI / 2 - phase) * period) / (2 * Math.PI);
        while (te <= 0.001) te += period / 2;
        const key = prop;
        let prev = { t: 0, v: f(0) };
        let first = true;
        while (prev.t < TOTAL + period / 2) {
          const nt = first ? te : prev.t + period / 2;
          const nv = f(nt);
          const from = {}; from[key] = prev.v;
          const to = { duration: nt - prev.t, ease: first ? "sine.out" : "sine.inOut" };
          to[key] = nv;
          tl.fromTo(el, from, to, prev.t);
          prev = { t: nt, v: nv };
          first = false;
        }
      }
      // escala respirando (1 ± amp) en .bgi
      function breathe(sel, amp, period, phase) {
        const el = sel + " .bgi";
        const f = (t) => 1 + amp * Math.sin((2 * Math.PI * t) / period + phase);
        let te = ((Math.PI / 2 - phase) * period) / (2 * Math.PI);
        while (te <= 0.001) te += period / 2;
        let prev = { t: 0, v: f(0) };
        let first = true;
        while (prev.t < TOTAL + period / 2) {
          const nt = first ? te : prev.t + period / 2;
          const nv = f(nt);
          tl.fromTo(el, { scale: prev.v }, { scale: nv, duration: nt - prev.t, ease: first ? "sine.out" : "sine.inOut" }, prev.t);
          prev = { t: nt, v: nv };
          first = false;
        }
      }

      // ---------------- oscurecimiento integrado tras los lockups (escenas 1 y 5) ----------------
      chain("#bg-dim", [
        { t: 0,    x: 960, y: 590, s: 0.8,  o: 0 },

      // ---------------- deriva organica (cada luz con sus propios periodos, amplitudes y fases) ----------------
      drift("#bg-halo",   "x", 70, 13.0, 0.4);   drift("#bg-halo",   "y", 50, 17.0, 1.9);   breathe("#bg-halo",   0.035, 11.0, 0.5);
      drift("#bg-glow",   "x", 55,  9.0, 2.1);   drift("#bg-glow",   "y", 42, 12.0, 0.2);   breathe("#bg-glow",   0.045,  7.5, 1.3);
      drift("#bg-core",   "x", 38,  7.0, 3.5);   drift("#bg-core",   "y", 30, 10.0, 1.0);   breathe("#bg-core",   0.06,   5.5, 2.4);
      drift("#bg-glow2",  "x", 60, 11.0, 0.9);   drift("#bg-glow2",  "y", 46, 14.0, 4.0);   breathe("#bg-glow2",  0.05,   8.5, 0.0);
      drift("#bg-violet", "x", 80, 16.0, 5.0);   drift("#bg-violet", "y", 60, 19.0, 2.6);   breathe("#bg-violet", 0.04,  12.5, 1.7);
      drift("#bg-dim",    "x", 18, 12.0, 0.0);   drift("#bg-dim",    "y", 12, 15.0, 1.0);

      // ---------------- grano: desplazamiento pseudoaleatorio (LCG con semilla) en cada fotograma ----------------
      (function grain() {
        let s = 20240607;
        const rnd = () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296);
        const N = Math.ceil(TOTAL * 30) + 2;
        // GRAIN_EVERY = fotogramas entre cambios de posicion del grano. 0 = grano fijo (el mas barato en H.264:
        // ~16 Mbps); 3 = "a tres", mas pelicula pero ~2x de bitrate (~30 Mbps).
        const GRAIN_EVERY = 0;
        const step = GRAIN_EVERY > 0 ? GRAIN_EVERY : N;
        for (let i = 0; i < N; i += step) {
          const gx = Math.floor(rnd() * 256), gy = Math.floor(rnd() * 256);
          tl.set("#fx-grain", { backgroundPosition: gx + "px " + gy + "px" }, i / 30);
        }
      })();

      window.__timelines["main"] = tl;
